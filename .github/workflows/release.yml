# 打 tag（例如 v0.1.0）就自动构建 Windows（64 位 + 32 位）/ macOS 安装包并发布到 GitHub Releases，
# 同时生成 tauri-plugin-updater 需要的 latest.json，已装的电脑会自动更新。
#
# 需要在仓库 Settings → Secrets 里配置：
#   VITE_SUPABASE_URL           Supabase 项目地址
#   VITE_SUPABASE_ANON_KEY      Supabase anon key（公开 key，可以打进客户端）
#   TAURI_SIGNING_PRIVATE_KEY   `npx tauri signer generate -w ~/.tauri/dzf.key` 生成的私钥内容
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  上一步设置的密码（没设就留空）
# 可选（macOS 签名 + 公证，没有的话 mac 用户首次要去 系统设置 → 隐私与安全性 → 仍要打开）：有了 Apple 开发者账号后，
# 在下面 tauri-action 的 env 里加上 APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY /
# APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID（注意：没配 Secret 时千万别写这些行，空值会让 macOS 打包失败）

name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows 64 位（绝大多数电脑）
          - platform: windows-latest
            args: ''
            targets: ''
          # Windows 32 位（仓库里的老机器）
          - platform: windows-latest
            args: '--target i686-pc-windows-msvc'
            targets: 'i686-pc-windows-msvc'
          # macOS 通用包（Intel + Apple 芯片）
          - platform: macos-latest
            args: '--target universal-apple-darwin'
            targets: 'aarch64-apple-darwin,x86_64-apple-darwin'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_APP_VERSION: ${{ github.ref_name }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'DZF 提醒 ${{ github.ref_name }}'
          releaseBody: |
            新装电脑下载 `-setup.exe`（64 位机器选 `x64`，32 位机器选 `x86`）；macOS 下载 `.dmg`，
            拖进「应用程序」后第一次打开会被拦：系统设置 → 隐私与安全性 → 拉到底点「仍要打开」。
            已经装过的电脑不用管：应用启动时会自己下载新版本，顶部提示一下重启就更新好了。
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # 三个打包任务是并行的，各写各的 latest.json 会互相覆盖（v0.1.0 的清单就丢了 64 位）。
  # 等它们都结束后，按 Release 里实际有的安装包重写一份完整的清单。
  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 生成完整的 latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: bash .github/scripts/make-latest-json.sh
